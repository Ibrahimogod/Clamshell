# xcodegen spec for the Mac host (menu-bar app). Generate with `xcodegen generate` in this folder.
# Developer ID–signed, notarized, NOT sandboxed (needs CGVirtualDisplay, ScreenCaptureKit, later CGEvent).
name: ClamshellHost
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  ClamshellKit:
    path: ../shared
targets:
  ClamshellHost:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources/Assets.xcassets       # app icon (tools/scripts/make-icons.swift)
    dependencies:
      # Contents/PlugIns/ClamshellMicrophone.driver; tools/scripts/install-microphone.sh installs it.
      - target: ClamshellMicrophone
        embed: true
        codeSign: true
        copy:
          destination: plugins
      - package: ClamshellKit
        products: [ClamshellWire, ClamshellSession, ClamshellTransport, ClamshellStream, ClamshellVideo,
                   ClamshellRateControl, ClamshellVirtualDisplay, ClamshellKeychain, ClamshellBench, ClamshellInput, ClamshellFiles]
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Clamshell Host
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSLocalNetworkUsageDescription: Clamshell Host listens on your local network so your phone can connect to this Mac.
        NSBonjourServices: [_clamshell._udp]
        # Finder › Services › Send to iPhone with Clamshell (1.1): SendToPhoneService.sendToPhone(_:userData:error:).
        NSServices:
          - NSMenuItem: { default: Send to iPhone with Clamshell }
            NSMessage: sendToPhone
            NSPortName: Clamshell Host
            NSRequiredContext: {}
            NSSendFileTypes: [public.item]
    entitlements:
      path: Generated/ClamshellHost.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLAMSHELL_BUNDLE_PREFIX).host
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 8
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
        GENERATE_INFOPLIST_FILE: NO
  # The phone's microphone on the Mac (1.1): a loopback AudioServerPlugIn, loaded by coreaudiod from
  # /Library/Audio/Plug-Ins/HAL once installed (tools/scripts/install-microphone.sh, run by you: it needs sudo).
  ClamshellMicrophone:
    type: bundle
    platform: macOS
    sources:
      - Driver
    info:
      path: Generated/Driver-Info.plist
      properties:
        CFBundleName: Clamshell Microphone
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: BNDL
        CFPlugInDynamicRegistration: false
        CFPlugInFactories:
          2D0A7082-DF8A-4680-AC6B-93F72351325B: ClamshellMicrophone_Create
        CFPlugInTypes:
          443ABAB8-E7B3-491A-B985-BEB9187030DB: [2D0A7082-DF8A-4680-AC6B-93F72351325B]
    settings:
      base:
        PRODUCT_NAME: ClamshellMicrophone
        PRODUCT_BUNDLE_IDENTIFIER: $(CLAMSHELL_BUNDLE_PREFIX).microphone
        WRAPPER_EXTENSION: driver
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 8
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        GCC_C_LANGUAGE_STANDARD: c11
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        WARNING_CFLAGS: [-Wall, -Wextra]
        OTHER_LDFLAGS: [-framework, CoreAudio, -framework, CoreFoundation]
