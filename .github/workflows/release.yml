# Prebuilt downloads for people who don't build Clamshell themselves (docs/SETUP.md › Install without building).
# No Apple Developer membership, no secrets, no signing identity: the phone app is an UNSIGNED .ipa that
# AltStore/SideStore sign with the user's own free Apple Account, and the Mac host is ad-hoc signed and not
# notarized. The build itself is tools/scripts/package.sh, so it can be reproduced on any Mac.
#
#   - push a tag v1.2.3         → build, then create the GitHub Release v1.2.3 (or update its files)
#   - Run workflow (no tag)     → build only; the files are on the run's page under Artifacts
#   - Run workflow, tag v1.2.3  → build that tag and publish it, for a tag that already exists
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to build and publish (e.g. v1.2.0). Empty: build the selected branch and only keep the files on the run."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    # Xcode 27 image (public preview): Xcode 27.0, 27.1 and 27.2 on macOS 27. The project needs Xcode 27.1+.
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write   # only the last step uses it, to create the release
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag || github.ref }}
          persist-credentials: false

      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version
          xcodegen --version

      - name: Build Clamshell.ipa and ClamshellHost.zip
        run: tools/scripts/package.sh "$RUNNER_TEMP/out"

      - name: Check the tag matches the app's version
        if: env.TAG != ''
        run: |
          VERSION=$(cat "$RUNNER_TEMP/out/VERSION")
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::Tag $TAG doesn't match the apps' version $VERSION (MARKETING_VERSION in both project.yml files)."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: clamshell-${{ github.sha }}
          path: |
            ${{ runner.temp }}/out/Clamshell.ipa
            ${{ runner.temp }}/out/ClamshellHost.zip
            ${{ runner.temp }}/out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish the GitHub Release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP/out"
          FILES=(Clamshell.ipa ClamshellHost.zip SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            cat > notes.md <<EOF
          Prebuilt downloads, no Apple Developer membership involved. See [Install without building](https://github.com/$GH_REPO/blob/$TAG/docs/SETUP.md#install-without-building).

          - **Clamshell.ipa**: the iPhone app, unsigned. Install it with AltStore or SideStore, which sign it with your own Apple Account (re-signed every 7 days).
          - **ClamshellHost.zip**: the Mac host, ad-hoc signed and not notarized. First launch: System Settings › Privacy & Security › Open Anyway. Grant Screen Recording and Accessibility again after every update.
          - **SHA256SUMS.txt**: \`shasum -a 256 -c SHA256SUMS.txt\`

          Changes: [CHANGELOG.md](https://github.com/$GH_REPO/blob/$TAG/CHANGELOG.md).
          EOF
            gh release create "$TAG" "${FILES[@]}" --verify-tag --title "Clamshell ${TAG#v}" --notes-file notes.md
          fi
