# xcodegen spec for the iOS client. Generate with `xcodegen generate` in this folder.
# Built with your own Apple Developer account (team in ../mac-host/Config/Local.xcconfig).
name: Clamshell
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: ../mac-host/Config/Base.xcconfig
  Release: ../mac-host/Config/Base.xcconfig
packages:
  ClamshellKit:
    path: ../shared
targets:
  Clamshell:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Probes
        type: folder
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Assets.xcassets       # app icon (tools/scripts/make-icons.swift)
    dependencies:
      - package: ClamshellKit
        products: [ClamshellWire, ClamshellSession, ClamshellTransport, ClamshellStream, ClamshellVideo,
                   ClamshellCodec, ClamshellRateControl, ClamshellKeychain, ClamshellBench, ClamshellInput]
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Clamshell
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIApplicationSupportsIndirectInputEvents: true
        CADisableMinimumFrameDurationOnPhone: true      # allow 120 Hz CADisplayLink on ProMotion
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Clamshell finds and connects to your Mac on the local network.
        NSBonjourServices: [_clamshell._udp]
        NSCameraUsageDescription: To scan the pairing code your Mac shows, and for the optional latency test (the rear camera watches a flashing square on the Mac's screen). Nothing is recorded or sent.
        NSFaceIDUsageDescription: Clamshell asks for your fingerprint or face before it connects to your Mac.
        # The app does its own end-to-end encryption (Noise over CryptoKit: X25519, ChaCha20-Poly1305,
        # SHA-256), so it is not the HTTPS-only exemption. See docs/app-store.md for the export answers.
        ITSAppUsesNonExemptEncryption: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLAMSHELL_BUNDLE_PREFIX).client
        MARKETING_VERSION: 1.0.2
        CURRENT_PROJECT_VERSION: 4
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Clamshell:
    build:
      targets:
        Clamshell: all
    run:
      config: Debug
